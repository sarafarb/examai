name: ExamAI Continuous Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and Push Gateway Image
      uses: docker/build-push-action@v5
      with:
        context: src/backend/
        file: src/backend/ExamAI.Gateway/Dockerfile
        push: true
        tags: ${{ secrets.REGISTRY_SERVER }}/examai-gateway:${{ github.sha }}

    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Kubernetes Cluster
      run: |
        kubectl apply -f infra/k8s/
        kubectl set image deployment/gateway-deployment gateway=${{ secrets.REGISTRY_SERVER }}/examai-gateway:${{ github.sha }}