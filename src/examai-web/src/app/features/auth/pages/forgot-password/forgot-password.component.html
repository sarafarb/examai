<div class="auth-container" dir="rtl" style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
  <h2>איפוס סיסמה</h2>
  
  <div *ngIf="!submitted">
    <p>הזן את כתובת האימייל שלך ונשלח לך הוראות לאיפוס הסיסמה.</p>
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div style="margin-bottom: 15px;">
        <input type="email" formControlName="email" placeholder="האימייל שלך" style="width: 100%; padding: 8px;" />
        <div *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" style="color: red; font-size: 12px; margin-top: 5px;">
          נא להזין כתובת אימייל תקינה.
        </div>
      </div>
      <button type="submit" [disabled]="loading" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">
        {{ loading ? 'שולח...' : 'שלח הוראות איפוס' }}
      </button>
    </form>
  </div>

  <div *ngIf="submitted" style="text-align: center;">
    <p style="color: green; font-weight: bold;">אם כתובת האימייל קיימת במערכת, שלחנו לך הוראות לאיפוס הסיסמה בדקות הקרובות.</p>
    <a routerLink="/auth/login" style="display: inline-block; margin-top: 15px;">חזרה למסך התחברות</a>
  </div>
</div>
