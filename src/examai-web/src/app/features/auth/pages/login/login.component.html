<div class="auth-container" dir="rtl" style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
  <h2>התחברות ל-ExamAI</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label>אימייל</label>
      <input type="email" formControlName="email" style="width: 100%; padding: 8px; margin-top: 5px;" />
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" style="color: red; font-size: 12px;">
        נא להזין כתובת אימייל תקינה.
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>סיסמה</label>
      <input type="password" formControlName="password" style="width: 100%; padding: 8px; margin-top: 5px;" />
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" style="color: red; font-size: 12px;">
        הסיסמה היא שדה חובה.
      </div>
    </div>

    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
      <label>
        <input type="checkbox" formControlName="rememberMe" /> זכור אותי
      </label>
      <a routerLink="/auth/forgot-password" style="font-size: 14px;">שכחת סיסמה?</a>
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px; font-weight: bold;">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">
      {{ loading ? 'מתחבר...' : 'התחבר' }}
    </button>
  </form>

  <div style="margin-top: 20px; text-align: center;">
    <p>או התחבר באמצעות גוגל:</p>
    <asl-google-signin-button type="standard" size="large"></asl-google-signin-button>
  </div>

  <p style="margin-top: 20px; text-align: center;">
    אין לך חשבון? <a routerLink="/auth/register">הרשם כאן</a>
  </p>
</div>
