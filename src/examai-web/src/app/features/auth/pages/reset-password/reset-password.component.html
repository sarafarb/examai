<div class="auth-container" dir="rtl" style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
  <h2>בחירת סיסמה חדשה</h2>

  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label>סיסמה חדשה</label>
      <input type="password" formControlName="newPassword" style="width: 100%; padding: 8px; margin-top: 5px;" />
      <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.errors?.['minlength']" style="color: red; font-size: 12px;">
        הסיסמה חייבת להכיל לפחות 8 תווים.
      </div>
      <div style="margin-top: 5px; font-size: 13px;">
        חוזק סיסמה: <span style="font-weight: bold;">{{ passwordStrengthText }}</span>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>אימות סיסמה</label>
      <input type="password" formControlName="confirmPassword" style="width: 100%; padding: 8px; margin-top: 5px;" />
      <div *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.hasError('mismatch')" style="color: red; font-size: 12px;">
        הסיסמאות אינן תואמות.
      </div>
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px;">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading || resetForm.invalid" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer;">
      {{ loading ? 'מעדכן...' : 'עדכן סיסמה וכנס' }}
    </button>
  </form>
</div>
